name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skill_cortex
          POSTGRES_PASSWORD: skill_cortex
          POSTGRES_DB: skill_cortex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skill_cortex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://skill_cortex:skill_cortex@localhost:5432/skill_cortex_test
      TEST_DATABASE_URL: postgresql+psycopg://skill_cortex:skill_cortex@localhost:5432/skill_cortex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply and match the models
        run: alembic upgrade head && alembic check
      - run: pytest -q
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target prod -t skill-cortex-backend ./backend
      - run: docker build -t skill-cortex-frontend ./frontend

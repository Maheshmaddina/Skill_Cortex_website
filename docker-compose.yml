x-backend-env: &backend-env
  APP_ENV: development
  DATABASE_URL: postgresql+psycopg://skill_cortex:skill_cortex@db:5432/skill_cortex
  TEST_DATABASE_URL: postgresql+psycopg://skill_cortex:skill_cortex@db:5432/skill_cortex_test
  JWT_SECRET: dev-only-jwt-secret-change-me-in-production-0123456789
  FRONTEND_URL: http://localhost:5173
  CORS_ORIGINS: http://localhost:5173
  COOKIE_SECURE: "false"
  # Razorpay test-mode keys come from the project-root .env (never commit real keys)
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  # Notifications: console providers just log; switch to smtp / msg91 via the root .env
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
  SMS_PROVIDER: ${SMS_PROVIDER:-console}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
  EMAIL_FROM: ${EMAIL_FROM:-no-reply@skillcortex.local}
  MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
  MSG91_TEMPLATE_BOOKING_CONFIRMATION: ${MSG91_TEMPLATE_BOOKING_CONFIRMATION:-}
  MSG91_TEMPLATE_ADMIN_PAYMENT: ${MSG91_TEMPLATE_ADMIN_PAYMENT:-}
  MSG91_TEMPLATE_CANCELLATION: ${MSG91_TEMPLATE_CANCELLATION:-}
  MSG91_TEMPLATE_REFUND: ${MSG91_TEMPLATE_REFUND:-}
  MSG91_TEMPLATE_REMINDER: ${MSG91_TEMPLATE_REMINDER:-}
  ADMIN_NOTIFY_EMAILS: ${ADMIN_NOTIFY_EMAILS:-}
  ADMIN_NOTIFY_PHONES: ${ADMIN_NOTIFY_PHONES:-}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: skill_cortex
      POSTGRES_PASSWORD: skill_cortex
      POSTGRES_DB: skill_cortex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skill_cortex -d skill_cortex"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: { context: ./backend, target: dev }
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  # Background jobs (seat-hold expiry, booking completion; reminders later). Run exactly one.
  scheduler:
    build: { context: ./backend, target: dev }
    environment: *backend-env
    volumes:
      - ./backend:/app
    command: python -m app.scheduler
    depends_on:
      db:
        condition: service_healthy

  # React + Tailwind dev server: http://localhost:5173
  frontend:
    image: node:24-alpine
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules  # keep Linux binaries separate from a host install
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
